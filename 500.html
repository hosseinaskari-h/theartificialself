<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>500 — SYSTEM ANOMALY / HOSSEIN ASKARI</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" href="/favicon.ico">
    <style>
        :root {
            --ink: #000;
            --paper: #fff;
            --rule: #000;
            --hair: 1px;
            --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            --sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        * { box-sizing: border-box; border-radius: 0 !important; box-shadow: none !important; }
        html, body { margin: 0; background: var(--paper); color: var(--ink); overflow-x: hidden; }
        body {
            font-family: var(--mono); font-size: 13px; line-height: 1.4;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px; text-align: center;
        }
        .code {
            font-family: var(--sans); font-size: clamp(64px, 16vw, 160px);
            font-weight: 700; letter-spacing: -0.06em; margin: 0;
            line-height: 0.85; text-transform: uppercase;
        }
        h1 {
            font-family: var(--sans); font-size: clamp(18px, 4vw, 28px);
            font-weight: 700; letter-spacing: -0.03em; margin: 16px 0 12px;
            text-transform: uppercase;
        }
        p {
            font-size: 13px; max-width: 480px; margin: 0 0 28px; line-height: 1.6;
            color: #333;
        }
        a {
            display: inline-block; padding: 12px 24px;
            background: var(--ink); color: var(--paper);
            text-decoration: none; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.1em; font-size: 11px;
            border: var(--hair) solid var(--rule);
            transition: all 100ms linear;
        }
        a:hover { background: var(--paper); color: var(--ink); }
    </style>
</head>
<body>
    <div class="code">500</div>
    <h1>System Anomaly</h1>
    <p>The archive server encountered an unexpected internal condition. The operation could not be completed.</p>
    <a href="/">← Return to Archive Index</a>
</body>
</html>
